# Render Blueprint — one Docker web service serving the API and the built SPA.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: voice-khata
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOW_DEMO_AUTH
        value: "true"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./voice_khata.db
      # Optional — add real keys in the Render dashboard for live STT/LLM/TTS.
      - key: GNANI_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
